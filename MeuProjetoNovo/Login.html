<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="Estilo/login.css">
    <link rel="stylesheet" href="Estilo/global.css">
    <link rel="shortcut icon" href="Imagens/login/mascote_sem_fundo.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="Imagens/login/logotipoSemfundo.png" alt="logotipoSemfundo" id="logoEvolua">

    </header>

    <main>

        <form id="acesso">

            <div class="campo">

                <label for="usuario">CPF</label><br>
                <input type="text" id="usuario" name="cpf" placeholder="Digite seu cpf" required>

            </div>

            <br>

            <div class="campo">

                <label for="senha">Senha</label><br>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            </div>

            <br>

            <button type="submit">Entrar</button>

        </form>

    </main>


    <script src="Script/login.js"></script>

</body>
</html>
