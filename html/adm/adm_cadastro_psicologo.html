<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>
    <link rel="stylesheet" href="../../Estilo/amd_css/adm_cadastro.css">
    <link rel="stylesheet" href="../../Estilo/amd_css/globaladmin.css">
</head>

<body>

<header>
    <img src="../../Imagens/Login/logotipoSemfundo.png" alt="logo" id="logoEvolua">

    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav id="navMenu" class="nav-menu">
        <a href="adm_index.html">Evolua+</a>
        <a href="adm_cadastro.html">Cadastrar</a>
        <a href="adm_cadastro_psicologo.html">Cadastrar psicólogo</a>
        <a href="adm_busca_funcionario.html">Buscar Funcionário</a>
    </nav>
</header>

<main>

<form id="acesso">

    <div class="campo">
        <label>Nome:</label><br>
        <input type="text" id="usuario" required>
    </div>

    <div class="campo">
        <label>Email:</label><br>
        <input type="text" id="email" required>
    </div>

    <div class="campo">
        <label>Telefone:</label><br>
        <input type="text" id="telefone" required>
    </div>

    <div class="campo">
        <label>CPF:</label><br>
        <input type="text" id="cpf" required>
    </div>

    <div class="campo">
        <label>Senha:</label><br>
        <input type="text" id="senha" required>
    </div>

    <div class="campo">
        <label>CRP:</label><br>
        <input type="text" id="CRP">
    </div>

    <div class="campo">
        <label>Foto:</label><br>
        <input type="file" id="foto">
    </div>

    <button type="submit" id="botao">Cadastrar</button>

</form>

</main>

<script>
// MENU
function toggleMenu() {
    document.getElementById("navMenu").classList.toggle("show");
}

// ==========================
// BANCO LOCAL
// ==========================
function getUsuarios() {
    return JSON.parse(localStorage.getItem("usuarios")) || [];
}

function salvarUsuarios(lista) {
    localStorage.setItem("usuarios", JSON.stringify(lista));
}

// ==========================
// CADASTRO
// ==========================
const form = document.getElementById("acesso");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    const usuario = {
        id: Date.now(),
        nome: document.getElementById("usuario").value,
        email: document.getElementById("email").value,
        telefone: document.getElementById("telefone").value,
        cpf: document.getElementById("cpf").value,
        senha: document.getElementById("senha").value,
        crp: document.getElementById("CRP").value,
        foto: null
    };

    const file = document.getElementById("foto").files[0];

    if (file) {
        const reader = new FileReader();

        reader.onload = function() {
            usuario.foto = reader.result;
            salvar(usuario);
        };

        reader.readAsDataURL(file);
    } else {
        salvar(usuario);
    }
});

// ==========================
// SALVAR
// ==========================
function salvar(usuario) {
    let lista = getUsuarios();

    lista.push(usuario);

    salvarUsuarios(lista);

    alert("Usuário cadastrado com sucesso!");

    form.reset();
}
</script>

</body>
</html>
