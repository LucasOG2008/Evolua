<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Psicólogo</title>
    <link rel="stylesheet" href="../../Estilo/amd_css/adm_cadastro.css">
    <link rel="stylesheet" href="../../Estilo/amd_css/globaladmin.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<header>
    <a href="adm_index.html">
        <img src="../../Imagens/Home_page/logotipoSemfundo.png" alt="Logo Evolua+" id="logoEvolua" >
    </a>

    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav id="navMenu" class="nav-menu">
        <a href="adm_cadastro.html">Cadastrar</a>
        <a href="adm_cadastro_psicologo.html">Cadastrar psicólogo</a>
        <a href="adm_busca_funcionario.html">Buscar Funcionário</a>
    </nav>
</header>

<main>

<form id="acesso">

    <div class="campo">
        <label>Nome:</label><br>
        <input type="text" id="usuario" required>
    </div>

    <br>

    <div class="campo">
        <label>Email:</label><br>
        <input type="email" id="email" required>
    </div>

    <br>

    <div class="campo">
        <label>Telefone:</label><br>
        <input type="tel" id="telefone" maxlength="11" minlength="11" required>
    </div>

    <br>

    <div class="campo">
        <label>CPF:</label><br>
        <input type="text" id="cpf" maxlength="11" minlength="11" required>
    </div>

    <br>

    <div class="campo">
        <label>Senha:</label><br>
        <input type="password" id="senha" required>
    </div>

    <br>

    <div class="campo">
        <label>CRP:</label><br>
        <input type="text" id="CRP" maxlength="7" minlength="7" required>
    </div>

    <br>

    <div class="campo">
        <label>Foto:</label><br>
        <input type="file" id="foto" accept="image/*"  >
    </div>

    <br>

    <button type="submit" id="botao">Cadastrar</button>


</form>

</main>

<script>
    function toggleMenu() {
        document.getElementById("navMenu").classList.toggle("show");
    }
</script>
<script src="../../Js/adm_cadastro_psicologo.js"></script>

<script src="../../Js/Verificação.js"></script>

</body>
</html>
