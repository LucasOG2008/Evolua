<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adm Buscar</title>

    <link rel="stylesheet" href="../../Estilo/amd_css/globaladmin.css">
    <link rel="stylesheet" href="../../Estilo/amd_css/adm_busca_funcionario.css">
</head>

<body>

    <header>
        <img src="../../Imagens/Home_page/logotipoSemfundo.png" alt="Logo Evolua+" id="logoEvolua">
        
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <nav id="navMenu" class="nav-menu">
            <a href="adm_index.html">Evolua+</a>
            <a href="#">Cadastrar</a>
            <a href="adm_busca_funcionario.html">Buscar Funcionário</a>
        </nav>
    </header>

    <main>
        <h1>Perfis</h1>

        <!-- BOTÕES DE CADASTRO -->
        <button class="botaoc" onclick="cadastrarFuncionario()">Cadastrar Funcionário</button>
        <button class="botaoc" onclick="cadastrarPsicologo()">Cadastrar Psicólogo</button>

        <div>
            <button onclick="mostrarFuncionarios()" id="botao">Funcionários</button>
            <button onclick="mostrarPsicologos()" id="botao">Psicólogos</button>
        </div>

        <div class="container">

            <section id="funcionarios" class="metade"></section>

            <section id="psicologos" class="metade"></section>

        </div>
    </main>

    <hr>

    <footer>
        <img src="../../Imagens/Home_page/mascote_sem_fundo.png" alt="mascote">

        <div id="pag">
            <h4>Veja mais:</h4>
            <nav>
                <a href="adm_index.html">Evolua+</a>
                <a href="#">Cadastrar</a>
                <a href="#">Cadastrar psicólogo</a>
                <a href="adm_busca_funcionario.html">Buscar Funcionário</a>
            </nav>
    
        </div>

        <div id="rodape">
            <h4>Feito Por:</h4>
            <h5>Next Gen Devs</h5>
            <p>
                Carlos Eduardo Malheiro de Oliveira Almeida <br/>
                Lucas Oliveira Gomes <br/>
                Murilo Miranda de Castro Silva <br/>
                Geovani Oshiro Correa
            </p>
        </div>

    </footer>

    <script>
    function toggleMenu() {
        document.getElementById("navMenu").classList.toggle("show");
    }

    // ==========================
    // BANCO (localStorage)
    // ==========================
    function getFuncionarios() {
        return JSON.parse(localStorage.getItem("funcionarios")) || [];
    }

    function getPsicologos() {
        return JSON.parse(localStorage.getItem("psicologos")) || [];
    }

    function salvarFuncionarios(lista) {
        localStorage.setItem("funcionarios", JSON.stringify(lista));
    }

    function salvarPsicologos(lista) {
        localStorage.setItem("psicologos", JSON.stringify(lista));
    }

    // ==========================
    // CADASTRO
    // ==========================
    function cadastrarFuncionario() {
        const nome = prompt("Digite o nome do funcionário:");
        if (!nome) return;

        let lista = getFuncionarios();
        lista.push({ id: Date.now(), nome });

        salvarFuncionarios(lista);
        mostrarFuncionarios();
    }

    function cadastrarPsicologo() {
        const nome = prompt("Digite o nome do psicólogo:");
        if (!nome) return;

        let lista = getPsicologos();
        lista.push({ id: Date.now(), nome });

        salvarPsicologos(lista);
        mostrarPsicologos();
    }

    // ==========================
    // RENDER
    // ==========================
    function render(lista, containerId) {
        const container = document.getElementById(containerId);

        container.innerHTML = `
            <div class="barraBusca">
                <input type="text" placeholder="Buscar..." oninput="buscar('${containerId}', this.value)">
            </div>
        `;

        lista.forEach(item => {
            container.innerHTML += `
                <div class="perfil">
                    <p>${item.nome}</p>
                </div>
            `;
        });
    }

    // ==========================
    // MOSTRAR
    // ==========================
    function mostrarFuncionarios() {
        render(getFuncionarios(), "funcionarios");
    }

    function mostrarPsicologos() {
        render(getPsicologos(), "psicologos");
    }

    // ==========================
    // BUSCA
    // ==========================
    function buscar(tipo, texto) {
        let lista = tipo === "funcionarios"
            ? getFuncionarios()
            : getPsicologos();

        let filtrados = lista.filter(item =>
            item.nome.toLowerCase().includes(texto.toLowerCase())
        );

        render(filtrados, tipo);
    }

    // ==========================
    // INICIAR
    // ==========================
    window.onload = () => {
        mostrarFuncionarios();
        mostrarPsicologos();
    };
    </script>

</body>
</html>
