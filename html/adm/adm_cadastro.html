<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="../../Estilo/amd_css/adm_cadastro.css">
    <link rel="stylesheet" href="../../Estilo/amd_css/globaladmin.css">
    <link rel="shortcut icon" href="../../Estilo/amd_css/adm_cadastro.css" type="image/x-icon">
</head>
<body>
    <header>
        <img src="../../Imagens/Login/logotipoSemfundo.png" alt="logotipoSemfundo" id="logoEvolua">

        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        
        <nav id="navMenu" class="nav-menu">
            <a href="adm_index.html">Evolua+</a>
            <a href="adm_cadastro.html">Cadastrar</a>
            <a href="adm_cadastro_psicologo.html">Cadastrar psicólogo</a>
            <a href="adm_busca_funcionario.html">Buscar Funcionário</a>
        </nav>
    </header>

    <main>

        <form id="acesso">

            <div class="campo">

                <label for="nome">Nome:</label><br>
                <input type="text" id="usuario" name="nome" placeholder="Nome do funcionario" required>

            </div>

            <br>

            <div class="campo">

                <label for="cargo">Cargo:</label><br>
                <input type="text" id="cargo" name="cargo" placeholder="Digite o cargo " required>

            </div>

                <br>

            <div class="campo">
                <label for="Setor">Setor:</label><br>
                <input type="text" id="setor" name="setor" placeholder="Qual o setor dele" required>

            </div>

            <br>

            <div class="campo">

                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email" placeholder="Qual o Email dele " required>

            </div>

            <br>

            <div class="campo">

                <label for="telefone">Telefone:</label><br>
                <input type="text" id="telefone" name="telefone" placeholder="Qual o telefone dele" required>

            </div>

            <br>

            <div class="campo">

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" placeholder="Qual o cpf" required>

            </div>

            <br>

            <div class="campo">

                <label for="senha">Senha:</label><br>
                <input type="text" id="senha" name="senha" placeholder="Faça uma senha padrão" required>

            </div>

            <button id="botao" type="submit">Cadastrar</button>

        </form>

        <hr>

        <footer>
            <img src="../../Imagens/Home_page/mascote_sem_fundo.png" alt="mascote">
    
            <div id="pag">
                <h4>Veja mais:</h4>
                <nav>
                    <a href="adm_index.html">Evolua+</a>
                    <a href="adm_cadastro.html">Cadastrar</a>
                    <a href="adm_busca_funcionario.html">Buscar Funcionário</a>
                </nav>
        
            </div>
    
            <div id="rodape">
                <h4>Feito Por:</h4>
                <h5>Next Gen Devs</h5>
                <p>Carlos Eduardo Malheiro de Oliveira Almeida <br/>
                    Lucas Oliveira Gomes <br/>
                    Murilo Miranda de Castro Silva <br/>
                    Geovani Oshiro Correa
                </p>
            </div>
    
        </footer>

        <script>
            function toggleMenu() {
                document.getElementById("navMenu").classList.toggle("show");
            }
        </script>

    </main>

    <script src="../../Js/cadastro.js"></script>

</body>

</html>
