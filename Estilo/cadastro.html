<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="globaladmin.css">
    <link rel="shortcut icon" href="Imagens/login/mascote_sem_fundo.png" type="image/x-icon">
</head>
<body>
    <header>
        <img src="Imagens/login/logotipoSemfundo.png" alt="logotipoSemfundo" id="logoEvolua">

    </header>

    <main>

        <form id="acesso">

            <div class="campo">

                <label for="nome">Nome:</label><br>
                <input type="text" id="usuario" name="nome" placeholder="Digite o nome do funcionario" required>

            </div>

            <br>

            <div class="campo">

                <label for="cargo">Cargo:</label><br>
                <input type="text" id="cargo" name="cargo" placeholder="Digite o cargo do seu funcionario" required>

            </div>

            <div class="campo">

                <label for="Setor">Setor:</label><br>
                <input type="text" id="setor" name="setor" placeholder="Qual o setor dele" required>

            </div>
            
            <div class="campo">

                <label for="email">Email:</label><br>
                <input type="text" id="email" name="email" placeholder="Qual o Email dele " required>

            </div>

            <div class="campo">

                <label for="telefone">Telefone:</label><br>
                <input type="text" id="telefone" name="telefone" placeholder="Qual o telefone dele" required>

            </div>

            <div class="campo">

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" placeholder="Qual o cpf" required>

            </div>

            <div class="campo">

                <label for="senha">CPF:</label><br>
                <input type="text" id="senha" name="senha" placeholder="Faça uma senha padrão" required>

            </div>

            <br>

            <button type="submit">Cadastrar</button>

        </form>

    </main>

</body>
</html>
